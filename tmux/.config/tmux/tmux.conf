# =============================================================================
# tmux.conf — robust base config for nvim/compile/debug/log workflows
# Requires tmux >= 3.2 (Ubuntu 22.04+ ships 3.2a, 24.04 ships 3.4)
# =============================================================================

# -----------------------------------------------------------------------------
# Prefix: Ctrl-a (easier to reach than default Ctrl-b, screen-compatible)
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix   # Ctrl-a Ctrl-a sends literal Ctrl-a to the terminal

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"               # enable true-color passthrough for any outer terminal
set -g default-shell /usr/bin/fish                # use fish in all panes/windows

set -g history-limit 50000        # large scrollback — useful for long build/log output
set -g display-time 4000          # message display duration (ms)
set -g status-interval 5          # status bar refresh rate
set -g focus-events on            # let nvim know when it gains/loses focus
set -g escape-time 10             # reduce key escape delay (important for nvim)
set -g mouse on                   # click panes, drag borders, scroll with wheel

set -g base-index 1               # windows start at 1 not 0
set -g pane-base-index 1          # panes start at 1 too
set -gw renumber-windows on       # auto-renumber after close

# -----------------------------------------------------------------------------
# Splitting panes
# Mnemonic: | splits vertically (side-by-side), - splits horizontally (stacked)
# Both inherit the current pane's working directory
# -----------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows also open in the current directory
bind c new-window -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# Pane navigation — Vim-style hjkl (works even when nvim is open via smart-splits)
# -----------------------------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with uppercase HJKL (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quickly cycle through panes without prefix (Ctrl-a then arrow — use sparingly)
bind -r Tab select-pane -t :.+   # Prefix+Tab cycles forward through panes

# Swap current pane with last active pane
bind BSpace swap-pane -d -t "{last}"

# -----------------------------------------------------------------------------
# Window navigation
# -----------------------------------------------------------------------------
bind -r n next-window
bind -r p previous-window
bind Space last-window             # Prefix+Space jumps to last used window

# Jump to window by name with fuzzy picker (requires fzf)
bind W run "tmux list-windows -F '#I: #W' | fzf-tmux -p --reverse | cut -d: -f1 | xargs tmux select-window -t"

# -----------------------------------------------------------------------------
# Session management
# -----------------------------------------------------------------------------
bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# Switch to an existing session (interactive)
bind s choose-tree -sZ             # built-in tree view; overrides default 's'

# -----------------------------------------------------------------------------
# Layouts — useful presets for common workflows
# main-vertical: big pane left (nvim), narrow pane right (gdb/logs)
# even-horizontal: equal side-by-side panes
# -----------------------------------------------------------------------------
bind M-1 select-layout main-vertical
bind M-2 select-layout main-horizontal
bind M-3 select-layout even-horizontal
bind M-4 select-layout even-vertical
bind M-5 select-layout tiled

# Quick layout: nvim left, terminal right (opens new right pane if only one pane)
bind G run "tmux split-window -h -c '#{pane_current_path}'; tmux resize-pane -x 40"

# -----------------------------------------------------------------------------
# Copy mode — vi bindings (natural for nvim users)
# -----------------------------------------------------------------------------
set -gw mode-keys vi

bind Enter copy-mode               # Prefix+Enter enters copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Search in copy mode: / forward, ? backward (vi-style, prompts for input)
bind -T copy-mode-vi / command-prompt -T search -p "(search down)" "send-keys -X search-forward '%%'"
bind -T copy-mode-vi ? command-prompt -T search -p "(search up)"   "send-keys -X search-backward '%%'"

# Scroll in copy mode with Ctrl-d/u (half-page, like nvim)
bind -T copy-mode-vi C-d send -X halfpage-down
bind -T copy-mode-vi C-u send -X halfpage-up

# System clipboard integration (requires xclip or xsel)
if-shell "command -v xclip" \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"'
if-shell "command -v xsel" \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel --clipboard --input"'
if-shell "command -v wl-copy" \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"' # Wayland

# Paste from system clipboard
bind P run 'tmux set-buffer "$(xclip -out -selection clipboard 2>/dev/null || xsel --clipboard 2>/dev/null || wl-paste 2>/dev/null)"; tmux paste-buffer'

# -----------------------------------------------------------------------------
# Scratchpad — Ctrl-a t
# Floating popup terminal. Ctrl-d or 'exit' closes it.
# -----------------------------------------------------------------------------
bind t display-popup -E -w 80% -h 75% -T " scratch " "$SHELL"

# -----------------------------------------------------------------------------
# Pane utilities
# -----------------------------------------------------------------------------
# Break current pane out into its own window
bind b break-pane -d

# Join a pane FROM another window into current window (prompts for source: window.pane)
bind @ command-prompt -p "Join pane from (window[.pane]):" "join-pane -s '%%'"

# Capture current pane scrollback to ~/tmux-capture.txt
bind C-s run 'tmux capture-pane -pS -50000 > ~/tmux-capture.txt' \
  \; display "Scrollback saved to ~/tmux-capture.txt"

# Synchronize panes — type same input in all panes of this window (toggle)
bind Y set-window-option synchronize-panes \
  \; display "synchronize-panes: #{?pane_synchronized,ON,OFF}"

# -----------------------------------------------------------------------------
# Reload config
# -----------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# -----------------------------------------------------------------------------
# Help popup — Ctrl-a /
# Opens a scrollable cheat sheet of all custom bindings. q closes it.
# -----------------------------------------------------------------------------
bind / display-popup -E -w 90% -h 90% -T " tmux keys " "bash ~/.config/tmux/help.sh"

# -----------------------------------------------------------------------------
# Status bar
# -----------------------------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"          # dark background, light text

# Left: session name
set -g status-left-length 40
set -g status-left "#[bold,fg=#89b4fa] #S #[nobold,fg=#6c7086]│ "

# Right: host, date/time
set -g status-right-length 60
set -g status-right "#[fg=#6c7086]%H:%M  #[fg=#a6e3a1]#H "

# Window tabs
set -gw window-status-format         " #I:#W "
set -gw window-status-current-format "#[bold,fg=#1e1e2e,bg=#89b4fa] #I:#W #[default]"
set -gw window-status-separator      ""

# Pane border
set -g pane-border-style        "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Message / command line
set -g message-style "bg=#313244,fg=#cdd6f4"

# -----------------------------------------------------------------------------
# Pane title — show current command (useful when gdb, telnet, etc. are running)
# -----------------------------------------------------------------------------
set -g set-titles on
set -g set-titles-string "tmux: #S » #W"

# Automatically rename window to running command
set -gw automatic-rename on
set -gw automatic-rename-format "#{?#{==:#{pane_current_command},fish},#{b:pane_current_path},#{pane_current_command}}"

# =============================================================================
# END
# =============================================================================
